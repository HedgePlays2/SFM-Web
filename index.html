<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SFM-Web</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ===================================================== -->
<!-- TOP BAR -->
<!-- ===================================================== -->

<header id="topbar">

    <div class="logo">
        SFM-Web
    </div>


    <div class="menu">

        <button id="newScene">
            New
        </button>

        <button id="saveScene">
            Save
        </button>

        <button id="loadScene">
            Load
        </button>

        <label class="file-button">
            Import Model
            <input
                id="modelFile"
                type="file"
                accept=".glb,.gltf,.obj,.fbx"
                hidden
            >
        </label>

    </div>

</header>



<!-- ===================================================== -->
<!-- MAIN EDITOR -->
<!-- ===================================================== -->

<main id="editor">


    <!-- ================================================= -->
    <!-- LEFT PANEL -->
    <!-- ================================================= -->

    <aside id="leftPanel">


        <div class="panel-header">
            Scene
        </div>


        <div
            id="outliner"
            class="panel-section"
        >
        </div>


        <div class="panel-header">
            Create
        </div>


        <div class="button-grid">

            <button id="addCube">
                Cube
            </button>

            <button id="addSphere">
                Sphere
            </button>

            <button id="addLight">
                Light
            </button>

        </div>


        <div class="panel-header">
            Scene
        </div>


        <div class="button-grid">

            <button id="focusObject">
                Focus
            </button>

            <button id="deleteObject">
                Delete
            </button>

            <button id="resetCamera">
                Reset Camera
            </button>

            <button id="clearScene">
                Clear
            </button>

        </div>


    </aside>



    <!-- ================================================= -->
    <!-- CENTER -->
    <!-- ================================================= -->

    <section id="center">


        <!-- ============================================= -->
        <!-- TOOLBAR -->
        <!-- ============================================= -->

        <div id="toolbar">

            <button id="moveTool">
                Move
            </button>

            <button id="rotateTool">
                Rotate
            </button>

            <button id="scaleTool">
                Scale
            </button>

        </div>



        <!-- ============================================= -->
        <!-- VIEWPORT -->
        <!-- ============================================= -->

        <div id="viewport">


            <!-- ========================================= -->
            <!-- AI PANEL -->
            <!-- ========================================= -->

            <div id="aiPanel">

                <input
                    id="aiPrompt"
                    type="text"
                    placeholder="Ask AI..."
                >

                <button id="aiSend">
                    AI
                </button>


                <div id="aiOutput">
                </div>

            </div>


        </div>



        <!-- ============================================= -->
        <!-- STATUS BAR -->
        <!-- ============================================= -->

        <div id="statusbar">

            <span id="status">
                Loading SFM-Web...
            </span>

        </div>


    </section>



    <!-- ================================================= -->
    <!-- RIGHT PANEL -->
    <!-- ================================================= -->

    <aside id="rightPanel">


        <div class="panel-header">
            Properties
        </div>


        <div id="properties">

            <div class="empty-properties">
                Select an object
            </div>

        </div>


    </aside>


</main>



<!-- ===================================================== -->
<!-- TIMELINE -->
<!-- ===================================================== -->

<section id="timelinePanel">


    <div class="timeline-controls">


        <button id="timelineStart">
            |◀
        </button>


        <button id="timelinePrevious">
            ◀
        </button>


        <button id="timelinePlay">
            ▶
        </button>


        <button id="timelineNext">
            ▶
        </button>


        <button id="timelineEnd">
            ▶|
        </button>


        <button id="addKeyframe">
            ◆ Add Keyframe
        </button>


        <button id="deleteKeyframe">
            ◆ Delete Keyframe
        </button>


    </div>



    <div class="timeline-settings">

        Duration:

        <input
            id="duration"
            type="number"
            min="1"
            max="9999"
            step="1"
            value="10"
        >

        seconds

    </div>



    <div class="timeline-main">


        <span class="timeline-label">
            Time
        </span>


        <input
            id="timeline"
            type="range"
            min="0"
            max="10"
            step="0.01"
            value="0"
        >


        <span id="timeLabel">
            0.00s
        </span>


    </div>


</section>



<!-- ===================================================== -->
<!-- APPLICATION -->
<!-- ===================================================== -->

<script
    type="module"
    src="app.js"
></script>


</body>

</html>
