<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SFM-Web - Browser based 3D animation editor"
    >

    <title>SFM-Web</title>


    <!-- ================================================ -->
    <!-- ICON -->
    <!-- ================================================ -->

    <link
        rel="icon"
        type="image/png"
        href="icon.png"
    >


    <!-- ================================================ -->
    <!-- STYLE -->
    <!-- ================================================ -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- ================================================ -->
    <!-- THREE.JS IMPORT MAP -->
    <!-- ================================================ -->

    <script type="importmap">

    {
        "imports": {

            "three":
                "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",

            "three/addons/":
                "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"

        }
    }

    </script>

</head>


<body>


<!-- ==================================================== -->
<!-- SFM APPLICATION -->
<!-- ==================================================== -->

<div id="app">


    <!-- ================================================= -->
    <!-- TOP BAR -->
    <!-- ================================================= -->

    <header id="topbar">


        <div id="brand">

            <img
                src="icon.png"
                id="appIcon"
                alt="SFM-Web"
            >

            <span>
                SFM-Web
            </span>

        </div>


        <div id="menu">


            <button id="newScene">
                New
            </button>


            <button id="saveScene">
                Save
            </button>


            <button id="loadScene">
                Load
            </button>


            <label
                class="file-button"
                for="modelFile"
            >
                Import Model
            </label>


            <input
                id="modelFile"
                type="file"
                accept=".glb,.gltf,.obj"
                hidden
            >


        </div>


    </header>



    <!-- ================================================= -->
    <!-- EDITOR -->
    <!-- ================================================= -->

    <main id="editor">


        <!-- ============================================= -->
        <!-- LEFT PANEL -->
        <!-- ============================================= -->

        <aside id="leftPanel">


            <div class="panel-header">
                Scene
            </div>


            <div
                id="outliner"
                class="panel-section"
            >
            </div>


            <div class="panel-header">
                Create
            </div>


            <div class="button-grid">


                <button id="addCube">
                    Cube
                </button>


                <button id="addSphere">
                    Sphere
                </button>


                <button id="addLight">
                    Light
                </button>


            </div>


            <div class="panel-header">
                Scene Tools
            </div>


            <div class="button-grid">


                <button id="focusObject">
                    Focus
                </button>


                <button id="deleteObject">
                    Delete
                </button>


                <button id="resetCamera">
                    Reset Camera
                </button>


                <button id="clearScene">
                    Clear Scene
                </button>


            </div>


        </aside>



        <!-- ============================================= -->
        <!-- CENTER -->
        <!-- ============================================= -->

        <section id="center">


            <!-- ========================================= -->
            <!-- TOOLBAR -->
            <!-- ========================================= -->

            <div id="toolbar">


                <button
                    id="moveTool"
                    title="Move (W)"
                >
                    Move
                </button>


                <button
                    id="rotateTool"
                    title="Rotate (E)"
                >
                    Rotate
                </button>


                <button
                    id="scaleTool"
                    title="Scale (R)"
                >
                    Scale
                </button>


            </div>



            <!-- ========================================= -->
            <!-- 3D VIEWPORT -->
            <!-- ========================================= -->

            <div id="viewport">


                <!-- Three.js canvas is inserted here -->


                <!-- ===================================== -->
                <!-- AI PANEL -->
                <!-- ===================================== -->

                <div id="aiPanel">


                    <div class="ai-title">
                        SFM AI
                    </div>


                    <div class="ai-input-row">


                        <input
                            id="aiPrompt"
                            type="text"
                            placeholder="Ask SFM AI..."
                            autocomplete="off"
                        >


                        <button id="aiSend">
                            Send
                        </button>


                    </div>


                    <div id="aiOutput">
                    </div>


                </div>


            </div>



            <!-- ========================================= -->
            <!-- STATUS BAR -->
            <!-- ========================================= -->

            <div id="statusbar">


                <span id="status">
                    Loading SFM-Web...
                </span>


            </div>


        </section>



        <!-- ============================================= -->
        <!-- RIGHT PANEL -->
        <!-- ============================================= -->

        <aside id="rightPanel">


            <div class="panel-header">
                Properties
            </div>


            <div id="properties">


                <div class="empty-properties">
                    Select an object
                </div>


            </div>


        </aside>


    </main>



    <!-- ================================================= -->
    <!-- TIMELINE -->
    <!-- ================================================= -->

    <section id="timelinePanel">


        <!-- ============================================= -->
        <!-- CONTROLS -->
        <!-- ============================================= -->

        <div id="timelineControls">


            <button
                id="timelineStart"
                title="Beginning"
            >
                |◀
            </button>


            <button
                id="timelinePrevious"
                title="Previous frame"
            >
                ◀
            </button>


            <button
                id="timelinePlay"
                title="Play"
            >
                ▶
            </button>


            <button
                id="timelineNext"
                title="Next frame"
            >
                ▶
            </button>


            <button
                id="timelineEnd"
                title="End"
            >
                ▶|
            </button>


            <button id="addKeyframe">
                ◆ Add Keyframe
            </button>


            <button id="deleteKeyframe">
                ◆ Delete Keyframe
            </button>


        </div>



        <!-- ============================================= -->
        <!-- SETTINGS -->
        <!-- ============================================= -->

        <div id="timelineSettings">


            <label for="duration">
                Duration:
            </label>


            <input
                id="duration"
                type="number"
                min="1"
                max="9999"
                step="1"
                value="10"
            >


            <span>
                seconds
            </span>


        </div>



        <!-- ============================================= -->
        <!-- TIME SLIDER -->
        <!-- ============================================= -->

        <div id="timelineMain">


            <div class="timeline-label">
                Time
            </div>


            <input
                id="timeline"
                type="range"
                min="0"
                max="10"
                step="0.01"
                value="0"
            >


            <div id="timeLabel">
                0.00s
            </div>


        </div>



        <!-- ============================================= -->
        <!-- TRACKS -->
        <!-- ============================================= -->

        <div id="timelineTracks">
        </div>


    </section>


</div>



<!-- ==================================================== -->
<!-- START SFM-WEB -->
<!-- ==================================================== -->

<script
    type="module"
    src="./app.js"
></script>


</body>

</html>
