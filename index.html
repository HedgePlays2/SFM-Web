<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SFM-Web - A browser-based Source Filmmaker style editor"
    >

    <title>SFM-Web</title>

    <!-- Website icon -->
    <link
        rel="icon"
        type="image/png"
        href="icon.png"
    >

    <!-- Main stylesheet -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ===================================================== -->
<!-- APPLICATION -->
<!-- ===================================================== -->

<div id="app">


    <!-- ================================================= -->
    <!-- TOP BAR -->
    <!-- ================================================= -->

    <header id="topbar">

        <div id="brand">

            <img
                src="icon.png"
                alt="SFM-Web"
                id="appIcon"
            >

            <span>
                SFM-Web
            </span>

        </div>


        <div id="menu">

            <button id="newScene">
                New
            </button>

            <button id="saveScene">
                Save
            </button>

            <button id="loadScene">
                Load
            </button>

            <label
                class="file-button"
                for="modelFile"
            >
                Import Model
            </label>

            <input
                id="modelFile"
                type="file"
                accept=".glb,.gltf,.obj"
                hidden
            >

        </div>

    </header>



    <!-- ================================================= -->
    <!-- EDITOR -->
    <!-- ================================================= -->

    <main id="editor">


        <!-- ============================================= -->
        <!-- LEFT PANEL -->
        <!-- ============================================= -->

        <aside id="leftPanel">

            <div class="panel-header">
                Scene
            </div>


            <div
                id="outliner"
                class="panel-section"
            >

                <!-- Objects are added here by app.js -->

            </div>


            <div class="panel-header">
                Create
            </div>


            <div class="button-grid">

                <button id="addCube">
                    Cube
                </button>

                <button id="addSphere">
                    Sphere
                </button>

                <button id="addLight">
                    Light
                </button>

            </div>


            <div class="panel-header">
                Scene Tools
            </div>


            <div class="button-grid">

                <button id="focusObject">
                    Focus
                </button>

                <button id="deleteObject">
                    Delete
                </button>

                <button id="resetCamera">
                    Reset Camera
                </button>

                <button id="clearScene">
                    Clear Scene
                </button>

            </div>

        </aside>



        <!-- ============================================= -->
        <!-- CENTER -->
        <!-- ============================================= -->

        <section id="center">


            <!-- ========================================= -->
            <!-- TOOLBAR -->
            <!-- ========================================= -->

            <div id="toolbar">

                <button
                    id="moveTool"
                    title="Move (W)"
                >
                    Move
                </button>

                <button
                    id="rotateTool"
                    title="Rotate (E)"
                >
                    Rotate
                </button>

                <button
                    id="scaleTool"
                    title="Scale (R)"
                >
                    Scale
                </button>

            </div>


            <!-- ========================================= -->
            <!-- VIEWPORT -->
            <!-- ========================================= -->

            <div id="viewport">


                <!-- Three.js renderer goes here -->


                <!-- ===================================== -->
                <!-- AI PANEL -->
                <!-- ===================================== -->

                <div id="aiPanel">

                    <div class="ai-title">
                        SFM AI
                    </div>


                    <div class="ai-input-row">

                        <input
                            id="aiPrompt"
                            type="text"
                            placeholder="Ask SFM AI..."
                            autocomplete="off"
                        >

                        <button id="aiSend">
                            Send
                        </button>

                    </div>


                    <div id="aiOutput">

                    </div>

                </div>


            </div>


            <!-- ========================================= -->
            <!-- STATUS -->
            <!-- ========================================= -->

            <div id="statusbar">

                <span id="status">
                    Loading SFM-Web...
                </span>

            </div>

        </section>



        <!-- ============================================= -->
        <!-- RIGHT PANEL -->
        <!-- ============================================= -->

        <aside id="rightPanel">


            <div class="panel-header">
                Properties
            </div>


            <div id="properties">

                <div class="empty-properties">
                    Select an object
                </div>

            </div>

        </aside>


    </main>



    <!-- ================================================= -->
    <!-- TIMELINE -->
    <!-- ================================================= -->

    <section id="timelinePanel">


        <!-- ============================================= -->
        <!-- Timeline controls -->
        <!-- ============================================= -->

        <div id="timelineControls">

            <button
                id="timelineStart"
                title="Go to beginning"
            >
                |◀
            </button>


            <button
                id="timelinePrevious"
                title="Previous frame"
            >
                ◀
            </button>


            <button
                id="timelinePlay"
                title="Play"
            >
                ▶
            </button>


            <button
                id="timelineNext"
                title="Next frame"
            >
                ▶
            </button>


            <button
                id="timelineEnd"
                title="Go to end"
            >
                ▶|
            </button>


            <button id="addKeyframe">
                ◆ Add Keyframe
            </button>


            <button id="deleteKeyframe">
                ◆ Delete Keyframe
            </button>

        </div>



        <!-- ============================================= -->
        <!-- Timeline settings -->
        <!-- ============================================= -->

        <div id="timelineSettings">

            <label for="duration">
                Duration:
            </label>


            <input
                id="duration"
                type="number"
                min="1"
                max="9999"
                step="1"
                value="10"
            >


            <span>
                seconds
            </span>

        </div>



        <!-- ============================================= -->
        <!-- Timeline -->
        <!-- ============================================= -->

        <div id="timelineMain">


            <div class="timeline-label">
                Time
            </div>


            <input
                id="timeline"
                type="range"
                min="0"
                max="10"
                step="0.01"
                value="0"
            >


            <div id="timeLabel">
                0.00s
            </div>

        </div>


        <!-- ============================================= -->
        <!-- Timeline tracks -->
        <!-- ============================================= -->

        <div id="timelineTracks">

            <!-- Animation tracks will be added here -->

        </div>

    </section>



</div>



<!-- ===================================================== -->
<!-- MAIN APPLICATION -->
<!-- ===================================================== -->

<script
    type="module"
    src="app.js"
></script>


</body>

</html>
